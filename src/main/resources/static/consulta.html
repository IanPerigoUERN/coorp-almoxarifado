	<!DOCTYPE html>
	<html lang="pt-BR">
	<head>
	    <meta charset="UTF-8">
	    <title>Coorp - Consulta de Produtos</title>
	    <link rel="stylesheet" href="style.css">
	    <script>
	        // Protege a página: se não tiver token, volta pro login
	        if (!localStorage.getItem('token')) {
	            window.location.href = '/login.html';
	        }
	    </script>
	</head>
	<body>
	
	    <header>
	        <div class="logo">
	            <h1>📦 Coorp</h1>
	            <span>Consulta de Produtos</span>
	        </div>
	        <div style="margin-left: auto; display: flex; gap: 10px;">
	            <button onclick="window.location.href='/index.html'" class="btn-secondary">Voltar ao Cadastro</button>
	            <button onclick="logout()" class="btn-delete">Sair</button>
	        </div>
	    </header>
	
	    <main>
	        <!-- Seção de Filtros -->
	        <section class="card">
	            <h2>Filtros de Consulta</h2>
	            <form id="formFiltros">
	                <div class="row">
	                    <div class="input-group">
	                        <label>Nome do Produto</label>
	                        <input type="text" id="filtroNome" placeholder="Digite parte do nome...">
	                    </div>
	                    <div class="input-group">
	                        <label>Status do Estoque</label>
	                        <select id="filtroStatus" style="padding: 0.7rem; border-radius: 4px; border: 1px solid #ccc;">
	                            <option value="">Todos</option>
	                            <option value="ok">Estoque OK</option>
	                            <option value="baixo">Estoque Baixo</option>
	                            <option value="zerado">Estoque Zerado</option>
	                        </select>
	                    </div>
	                    <div class="input-group">
	                        <label>Preço Mínimo (R$)</label>
	                        <input type="number" step="0.01" id="filtroPrecoMin" placeholder="0.00">
	                    </div>
	                    <div class="input-group">
	                        <label>Preço Máximo (R$)</label>
	                        <input type="number" step="0.01" id="filtroPrecoMax" placeholder="0.00">
	                    </div>
	                </div>
	                <div class="form-actions">
	                    <button type="submit" class="btn-primary">🔍 Buscar</button>
	                    <button type="button" class="btn-secondary" onclick="limparFiltros()">Limpar Filtros</button>
	                </div>
	            </form>
	        </section>
	
	        <!-- Seção de Resultados -->
	        <section class="card">
	            <div class="table-header">
					<h2>Resultados da Consulta</h2>
					    <div style="display: flex; gap: 1rem; align-items: center;">
					        <span id="contadorResultados" style="font-weight: bold; color: #2c3e50;">0 produtos encontrados</span>
					        <button onclick="gerarRelatorioPDF()" class="btn-primary">📄 Gerar Relatório PDF</button>
					    </div>
					</div>
	            <div class="table-responsive">
	                <table id="tabelaConsulta">
	                    <thead>
	                        <tr>
	                            <th>ID</th>
	                            <th>Nome</th>
	                            <th>Descrição</th>
	                            <th>Qtd. Atual</th>
	                            <th>Qtd. Mín.</th>
	                            <th>Preço</th>
	                            <th>Status</th>
	                        </tr>
	                    </thead>
	                    <tbody></tbody>
	                </table>
	            </div>
	            <div id="msgVazia" class="empty-state" style="display: none;">
	                Nenhum produto encontrado com os filtros informados.
	            </div>
	        </section>
	    </main>
	
	    <script src="consulta.js"></script>
	</body>
	</html>
